[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energydb"
version = "0.3.1"
description = "Energy database: hierarchy + series metadata on Postgres, bitemporal I/O via timedb"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "timedb>=0.2.0",
    "energydatamodel>=0.0.5",
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.1",
    "sqlalchemy>=2.0",
    "polars>=1.0",
    "pint>=0.23",
]

[tool.setuptools]
packages = ["energydb"]

[tool.setuptools.package-data]
energydb = ["sql/*.sql"]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=2.0",
]
