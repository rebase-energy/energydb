[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energydb"
version = "0.8.0"
description = "Energy database: hierarchy + series metadata on Postgres, 3-dimensional time-series I/O via timedb"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "timedatamodel==0.8.0",
    "timedb==0.8.0",
    "energydatamodel==0.8.0",
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.1",
    "sqlalchemy>=2.0",
    "polars>=1.0",
    "pint>=0.23",
]

[tool.setuptools]
packages = ["energydb"]

[project.optional-dependencies]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "nbsphinx>=0.9.0",
    "ipykernel>=6.0.0",
    "myst-parser>=2.0.0",
]
